name: Deploy WEBSPIDER to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          mkdir -p dist
          cp frontend/index.html dist/index.html
          cp frontend/style.css dist/style.css
          cp frontend/app.js dist/app.js
          python - <<'PY'
          from pathlib import Path
          page = Path("dist/index.html")
          html = page.read_text(encoding="utf-8")
          html = html.replace('href="/assets/style.css"', 'href="./style.css"')
          html = html.replace('src="/assets/app.js"', 'src="./app.js"')
          html = html.replace('href="/"', 'href="./"')
          html = html.replace('href="/docs"', 'href="https://github.com/annasb-oss/WEBSPIDER---THE-INTERNET-EXPLORER-ENGINE-/blob/main/README.md"')
          html = html.replace("Ambiente local", "Prévia estática")
          page.write_text(html, encoding="utf-8")
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
